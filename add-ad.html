<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إضافة إعلان - Service Regueb</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="main-header">
    <a href="index.html" class="logo">Service Regueb</a>
    <a href="login.html" class="btn-auth">🔑 تسجيل الدخول</a>
  </header>

  <main class="form-page-container">
    <h2>أضف إعلانك الجديد ➕</h2>
    <p class="subtitle">انشر خدمتك أو وسيلة التوصيل الخاصة بك</p>

    <form onsubmit="handleAdPublish(event)">
      <div class="form-group">
        <label for="adTitle">عنوان الإعلان</label>
        <input type="text" id="adTitle" placeholder="مثال: توصيل سريع بالموتور في الرقاب" required>
      </div>

      <div class="form-group">
        <label for="adCategory">التصنيف الرئيسي</label>
        <select id="adCategory" onchange="toggleDeliveryOptions(this.value)" required>
          <option value="">اختر التصنيف</option>
          <option value="خدمات">🔧 الخدمات والحرفيين</option>
          <option value="توصيل">🛵 التوصيل فقط</option>
        </select>
      </div>

      <!-- نوع التوصيل (يظهر فقط إذا اختار التوصيل) -->
      <div class="form-group" id="deliveryTypeGroup" style="display: none;">
        <label for="deliveryType">نوع وسيلة النقل / التوصيل</label>
        <select id="deliveryType">
          <option value="موتور">🛵 أصحاب الموتورات</option>
          <option value="سيارة">🚗 أصحاب السيارات</option>
          <option value="لواج">🚐 أصحاب النقل Louage</option>
        </select>
      </div>

      <div class="form-group">
        <label for="adPrice">السعر / التكلفة</label>
        <input type="text" id="adPrice" placeholder="مثال: حسب المشوار أو 5 د.ت" required>
      </div>

      <div class="form-group">
        <label for="adPhone">رقم الهاتف للتواصل</label>
        <input type="tel" id="adPhone" placeholder="مثال: 22113344" maxlength="8" required>
      </div>

      <div class="form-group">
        <label for="adDesc">تفاصيل الخدمة</label>
        <textarea id="adDesc" rows="4" placeholder="اكتب أوقات العمل، المناطق التي تتنقل لها..." required></textarea>
      </div>

      <button type="submit" id="pubBtn" class="btn-submit">نشر الإعلان الآن 🚀</button>
    </form>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span>🏠</span><span>الرئيسية</span></a>
    <a href="add-ad.html" class="nav-item active"><span>➕</span><span>إضافة إعلان</span></a>
    <a href="login.html" class="nav-item"><span>🔑</span><span>دخول</span></a>
  </nav>

  <script src="script.js"></script>
  <script>
    function toggleDeliveryOptions(val) {
      const group = document.getElementById('deliveryTypeGroup');
      if (val === 'توصيل') {
        group.style.display = 'block';
      } else {
        group.style.display = 'none';
      }
    }
  </script>
</body>
</html>
