<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إضافة إعلان جديد - Service Regueb</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Header & Navigation Bar -->
  <header class="site-header">
    <div class="header-container">
      
      <!-- الشعار / اللوجو -->
      <a href="index.html" class="logo">
        <i class="fa-solid fa-handshake-angle"></i> Service Regueb
      </a>

      <!-- زر العودة للصفحة الرئيسية -->
      <div class="user-actions">
        <a href="index.html" class="action-btn btn-login">
          <i class="fa-solid fa-house"></i> <span>الرئيسية</span>
        </a>
      </div>

    </div>
  </header>

  <div class="container" style="max-width: 650px;">
    
    <div class="section-banner" style="margin-top: 20px;">
      <h2><i class="fa-solid fa-plus-circle"></i> إضافة إعلان جديد</h2>
      <p>أدخل تفاصيل خدمتك لليتم نشرها وسهولة الوصول إليك في الرقاب</p>
    </div>

    <!-- نموذج إضافة الإعلان -->
    <div style="background-color: var(--card-bg); padding: 25px; border-radius: var(--radius); box-shadow: var(--shadow-sm); border: 1px solid var(--border-color);">
      
      <form id="addAdForm">
        
        <!-- الاسم أو اسم المحل -->
        <div style="margin-bottom: 18px;">
          <label style="display: block; font-weight: 600; margin-bottom: 8px;">الاسم الكامل / اسم الخدمة:</label>
          <input type="text" class="search-input" style="max-width: 100%;" placeholder="مثال: أحمد - توصيل الطلبات / سباكة وتصليح" required>
        </div>

        <!-- رقم الهاتف -->
        <div style="margin-bottom: 18px;">
          <label style="display: block; font-weight: 600; margin-bottom: 8px;">رقم الهاتف (تونس):</label>
          <input type="tel" class="search-input" style="max-width: 100%;" placeholder="مثال: 50123456" pattern="[0-9]{8}" required>
        </div>

        <!-- القسم الرئيسي -->
        <div style="margin-bottom: 18px;">
          <label style="display: block; font-weight: 600; margin-bottom: 8px;">اختر القسم:</label>
          <select class="filter-select" style="max-width: 100%;" required>
            <option value="">-- اختر القسم المناسب --</option>
            <option value="bike">توصيل - دراجات نارية</option>
            <option value="car">توصيل - سيارات وتاكسي</option>
            <option value="louage">توصيل - لواجات</option>
            <option value="craftsman">خدمات وحرفيين (سباك، كهربائي، إلخ)</option>
            <option value="other">خدمات أخرى</option>
          </select>
        </div>

        <!-- تفاصيل إضافية -->
        <div style="margin-bottom: 20px;">
          <label style="display: block; font-weight: 600; margin-bottom: 8px;">وصف الخدمة أو تفاصيل أخرى:</label>
          <textarea class="search-input" style="max-width: 100%; height: 100px; resize: vertical;" placeholder="أكتب التفاصيل هنا (أوقات العمل، المناطق، إلخ)..."></textarea>
        </div>

        <!-- زر الإرسال -->
        <button type="submit" class="action-btn btn-add" style="width: 100%; justify-content: center; padding: 12px; font-size: 1rem; border-radius: 8px;">
          <i class="fa-solid fa-paper-plane"></i> نشر الإعلان الآن
        </button>

      </form>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
