<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب - Service Regueb</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="main-header">
    <a href="index.html" class="logo">Service Regueb</a>
    <a href="index.html" class="btn-auth">🏠 الرئيسية</a>
  </header>

  <main class="form-page-container">
    <h2>إنشاء حساب جديد 📝</h2>
    <p class="subtitle">انضم لمنصة الخدمة والحرفيين في الرقاب</p>

    <form onsubmit="handleSignup(event)">
      <div class="form-group">
        <label for="regName">الاسم واللقب</label>
        <input type="text" id="regName" placeholder="مثال: محمد علي" required>
      </div>

      <div class="form-group">
        <label for="regPhone">رقم الهاتف</label>
        <input type="tel" id="regPhone" placeholder="مثال: 22113344" maxlength="8" required>
      </div>

      <div class="form-group">
        <label for="regPassword">كلمة السر</label>
        <input type="password" id="regPassword" placeholder="أدخل كلمة السر" required>
      </div>

      <button type="submit" class="btn-submit">إنشاء الحساب 🚀</button>
    </form>

    <div style="text-align: center; margin-top: 18px; font-size: 13.5px; color: #475569;">
      لديك حساب بالفعل؟ <a href="login.html" style="color: #2563eb; font-weight: bold; text-decoration: none;">تسجيل الدخول</a>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span>🏠</span><span>الرئيسية</span></a>
    <a href="add-ad.html" class="nav-item"><span>➕</span><span>إضافة إعلان</span></a>
    <a href="login.html" class="nav-item"><span>🔑</span><span>دخول</span></a>
  </nav>

  <script src="script.js"></script>
  <script>
    function handleSignup(e) {
      e.preventDefault();
      alert('✅ تم إنشاء الحساب بنجاح!');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
