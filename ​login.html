<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - Service Regueb</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="main-header">
    <a href="index.html" class="logo">Service Regueb</a>
    <a href="index.html" class="btn-auth">🏠 الرئيسية</a>
  </header>

  <main class="form-page-container">
    <h2>تسجيل الدخول 🔑</h2>
    <p class="subtitle">مرحباً بك في منصة خدمات الرقاب</p>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="loginPhone">رقم الهاتف</label>
        <input type="tel" id="loginPhone" placeholder="أدخل رقم هاتفك" maxlength="8" required>
      </div>

      <div class="form-group">
        <label for="loginPassword">كلمة السر</label>
        <input type="password" id="loginPassword" placeholder="أدخل كلمة السر" required>
      </div>

      <button type="submit" class="btn-submit">دخول 🚀</button>
    </form>

    <div style="text-align: center; margin-top: 18px; font-size: 13.5px; color: #475569;">
      ليس لديك حساب؟ <a href="signup.html" style="color: #2563eb; font-weight: bold; text-decoration: none;">إنشاء حساب جديد</a>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span>🏠</span><span>الرئيسية</span></a>
    <a href="add-ad.html" class="nav-item"><span>➕</span><span>إضافة إعلان</span></a>
    <a href="login.html" class="nav-item active"><span>🔑</span><span>دخول</span></a>
  </nav>

  <script src="script.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      alert('✅ تم تسجبل الدخول (الواجهة جاهزة)!');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
